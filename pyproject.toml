[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "caselens-agent"
version = "0.1.0"
description = "Evidence-grounded VLM and Jev after-sales triage agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pillow>=10.4,<13",
  "typer>=0.12,<1",
  "typesafe-sdk>=0.7,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph==0.6.11",
  "mcp==1.30.0",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
caselens = "caselens.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.hatch.build]
exclude = ["caselens.json", "**/caselens.json", ".uv-cache", ".verify-venv", ".venv", "outputs"]

[tool.hatch.build.targets.wheel]
packages = ["src/caselens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".verify-venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
